; ============================================================
; 数字FAFU 自动化 —— 配置模板
;
; 用法：复制为 config.ini 并填入真实值
;   cp config.example.ini config.ini && chmod 600 config.ini
; config.ini 含个人凭据，已加入 .gitignore，切勿提交到版本库
;
; 也可用环境变量覆盖（优先级更高）：
;   FAFU_USERNAME / FAFU_PASSWORD / FAFU_DEVICE_ID / FAFU_TENANT_ID
; ============================================================

[account]
; 【必填】学号 / 统一身份认证账号
username =

; 【必填】统一身份认证（CAS）密码，明文
password =

; 【必填】设备锁绑定的设备 ID —— 最易出错项
;   · 必须是该账号已在服务端绑定的那台设备的 Android ID
;   · 精确匹配且区分大小写，差一个字符即被拒
;     （提示："同一账号仅允许在同一台手机登录…"）
;   · 获取方式（任选其一）：
;       ① 真机读取：设置 → 关于手机 → 状态信息，或 adb shell settings get secure android_id
;       ② 从 App 抓包看 deviceId 字段
;       ③ 用管理端解绑接口先解除旧绑定，再用当前设备重登
;   · 更换设备时，先解绑：
;     GET http://stuhtapi.fafu.edu.cn/health-api/user/unbind/device/student_file/{id}
device_id =

; 【已预置】WeLink 租户 ID —— 福建农林大学固定值，全校一致
;   仅当换其他学校时才需修改（可抓包或从 App 配置获取）
tenant_id = 4DFC1E0256214BDC84F39D6E9FF41C38


[location]
; 【可选】打卡上报的定位，默认校区坐标。要改就取消注释
; （也可用环境变量 FAFU_LNG / FAFU_LAT）
; lng = 119.243462
; lat = 26.088417


[welink]
; 以下均【无需手填】：首次运行 login_once.py 后，
; 脚本会自动把会话态写入 state.json（含 token / refresh_token）。
; 如需手工覆盖，取消注释即可。
; we_link_token =
; refresh_token =
